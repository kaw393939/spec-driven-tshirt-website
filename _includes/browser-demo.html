<section class="browser-experiment" data-browser-demo aria-label="Local browser state experiment">
  <p class="mini-label">A tiny browser experiment</p>
  <p class="browser-headline" data-browser-headline>Hello, browser.</p>
  <p data-browser-count role="status" aria-live="polite">Changes in this tab: 0. This is the initial HTML.</p>
  <div class="experiment-actions" data-enhancement hidden><button type="button" class="button" data-browser-change>Change this headline</button><button type="button" class="text-button" data-browser-reset>Reset this experiment</button></div>
  <p class="mini-label">Live page text (DOM)</p>
  <pre><code data-browser-code>&lt;p&gt;Hello, browser.&lt;/p&gt;</code></pre>
  <p class="experiment-caption">The button changes only local text and memory. It doesn’t send a request or save anything.</p>
  <noscript><p>JavaScript is off. Enable it to run the local experiment; the initial text remains readable.</p></noscript>
</section>
